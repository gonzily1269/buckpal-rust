[workspace]
resolver = "3"
members = [
    "crates/bootstrap",
    "crates/domain",
    "crates/application",
    "crates/adapters",
    "crates/web",
]
default-members = [
    "crates/bootstrap",
    "crates/domain",
    "crates/application",
    "crates/adapters",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
# 個別の lint 設定が all / pedantic の設定より優先されるよう、priority を -1 に設定
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# unwrap / expect による panic
unwrap_used = "deny"
expect_used = "deny"

# 明示的な panic・未実装処理
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# インデックス・文字列スライスによる panic
indexing_slicing = "deny"
string_slice = "deny"

# ドキュメントコメント内の Markdown 表記に関する lint は許可する
doc_markdown = "allow"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
buckpal-adapters = { path = "crates/adapters" }
buckpal-application = { path = "crates/application" }
buckpal-domain = { path = "crates/domain" }
buckpal-web = { path = "crates/web" }
serde = "1"
sqlx = "0.9"
thiserror = "2"
tokio = "1"
tracing = "0.1"
