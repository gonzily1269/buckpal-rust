[package]
name = "buckpal-rust"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = [
    ".",
    "crates/domain",
    "crates/application",
    "crates/adapters",
    "crates/web",
]
default-members = [
    ".",
    "crates/domain",
    "crates/application",
    "crates/adapters",
    "crates/web",
]

[workspace.lints.clippy]
# 個別の lint 設定が all / pedantic の設定より優先されるよう、priority を -1 に設定
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# unwrap / expect による panic
unwrap_used = "deny"
expect_used = "deny"

# 明示的な panic・未実装処理
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# インデックス・文字列スライスによる panic
indexing_slicing = "deny"
string_slice = "deny"

# ドキュメントコメント内の Markdown 表記に関する lint は許可する
doc_markdown = "allow"

[lints]
workspace = true

[dependencies]
anyhow = "1"
any_spawner = "0.3"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", features = [
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite",
    "tls-rustls-ring-webpki",
] }
toml = "1.1"
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
buckpal-adapters = { path = "crates/adapters" }
buckpal-application = { path = "crates/application" }
buckpal-web = { path = "crates/web" }
