[activity]
empty = "送金履歴はまだありません。"
transfer = "口座 {} → 口座 {}"
amount = "−{}"

[errors]
internal_server_error = "処理中にエラーが発生しました。サーバーログを確認してください。"

[status.success]
class = "alert-success"
text = "送金が完了しました。"

[status.invalid-amount]
class = "alert-error"
text = "金額は1以上の整数で入力してください。"

[status.same-account]
class = "alert-error"
text = "送金元と送金先には別の口座を選んでください。"

[status.threshold]
class = "alert-error"
text = "送金額が設定された上限を超えています。"

[status.account-not-found]
class = "alert-error"
text = "指定された口座が見つかりません。"

[status.insufficient-funds]
class = "alert-error"
text = "残高が不足しています。"

[status.balance-overflow]
class = "alert-error"
text = "送金後の残高が上限を超えます。"

[status.concurrent-update]
class = "alert-warning"
text = "口座残高が更新されました。残高を確認して、もう一度お試しください。"
